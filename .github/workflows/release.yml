name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Verify and sign release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Verify version and scripts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/version.py "$RELEASE_TAG"
          bash -n build.sh scripts/test.sh
          shellcheck build.sh scripts/test.sh
      - name: Load release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          value = os.environ.get('KEYSTORE_BASE64', '')
          if not value:
              raise SystemExit('Configure ANDROID_KEYSTORE_BASE64 before publishing')
          path = Path(os.environ['RUNNER_TEMP']) / 'release-signing.jks'
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          PY
      - name: Build with persistent release signing
        env:
          GSI_SIGNING_MODE: release
          GSI_RELEASE_KEYSTORE: ${{ runner.temp }}/release-signing.jks
          GSI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GSI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GSI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./build.sh
      - name: Run tests and packaging checks
        run: ./scripts/test.sh
      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p build/release
          cp build/GSI-SMS-Guard.apk "build/release/GSI-SMS-Guard-${RELEASE_TAG}.apk"
          git archive --format=zip --prefix="gsi-sms-guard-${RELEASE_TAG}/" HEAD > "build/release/gsi-sms-guard-${RELEASE_TAG}-source.zip"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs build/GSI-SMS-Guard.apk > build/release/signing-certificate.txt
          cd build/release
          sha256sum -- *.apk *.zip signing-certificate.txt > SHA256SUMS
      - name: Upload verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: build/release/
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'release-signing.jks').unlink(missing_ok=True)
          PY
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release-assets
      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --title "GSI 短信修复框架 ${RELEASE_TAG}" --generate-notes --latest ./*
